      223-192: {name: rows, description: rows (memory view rows)}
      191-128: {name: row_stride_bytes, description: row_stride_bytes (signed, bytes)}
  vm:
    bits: 128
    ranges:
      127-96: {name: stride_bytes, description: stride_bytes (signed, bytes)}
      95-64: {name: reserved, description: reserved}
      63-40: {name: reserved, description: reserved}
      39-36: {name: fl, description: "flags"}
      35-32: {name: sd, description: storage_dtype, values: {"0": "i8", "1": "u8", "2": "i32", "3": "u32", "4": "f32", "5": "f16", "6": "bf16", "7-15": "reserved"}}
      31-0: {name: length, description: length (memory view length)}
