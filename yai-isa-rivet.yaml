structures:
  tc:
    bits: 32
    ranges:
      31-25: {name: reserved, description: reserved}
      24-23: {name: am, description: "arith_mode", values: {"0": "wrap", "1": "sat", "10": "reserved", "11": "reserved"}}
      22-20: {name: lo, description: layout, values: {"0": "canonical", "1-7": "reserved"}}
      19-16: {name: dt, description: dtype (element type), values: {"0000": "i8", "0001": "u8", "0010": "i32", "0011": "u32", "0100": "f32", "5-15": "reserved"}}
      15-8: {name: cols, description: cols (valid columns)}
      7-0: {name: rows, description: rows (valid rows)}
  bc:
    bits: 32
    ranges:
      31-12: {name: reserved, description: reserved}
      11-8: {name: dt, description: dtype (element type), values: {"0000": "i8", "0001": "u8", "0010": "i32", "0011": "u32", "0100": "f32", "5-15": "reserved"}}
      7-0: {name: len, description: len (valid length)}
  tm-0:
    bits: 128
    ranges:
      127-64: {name: col_stride_bytes, description: col_stride_bytes (signed, bytes)}
      63-16: {name: reserved, description: reserved}
      15-8: {name: fl, description: "flags"}
      7-4: {name: tf, description: transform, values: {"0": "normal", "1": "transpose", "2-15": "reserved"}}
      3-0: {name: sd, description: storage_dtype, values: {"0000": "i8", "0001": "u8", "0010": "i32", "0011": "u32", "0100": "f32", "0101": "f16", "0110": "bf16", "7-15": "reserved"}}
  tm-1:
    bits: 128
    start: 128
    ranges:
      255-224: {name: cols, description: cols (memory view columns)}
      223-192: {name: rows, description: rows (memory view rows)}
      191-128: {name: row_stride_bytes, description: row_stride_bytes (signed, bytes)}
  vm:
    bits: 128
    ranges:
      127-96: {name: stride_bytes, description: stride_bytes (signed, bytes)}
      95-64: {name: reserved, description: reserved}
      63-40: {name: reserved, description: reserved}
      39-36: {name: fl, description: "flags"}
      35-32: {name: sd, description: storage_dtype, values: {"0000": "i8", "0001": "u8", "0010": "i32", "0011": "u32", "0100": "f32", "0101": "f16", "0110": "bf16", "7-15": "reserved"}}
      31-0: {name: length, description: length (memory view length)}
  # Instruction format plates (32-bit non-scalar instruction word).
  fmt-r4:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode (per family)}
      27-25: {name: sel3, description: "selector, or 000"}
      24-22: {name: funct3, description: operation select}
      21-17: {name: field5, description: "5-bit field (per major4)"}
      16-12: {name: field5, description: "5-bit field, usually B/xCoord"}
      11-7: {name: field5, description: "5-bit field, usually A/S"}
      6-2: {name: field5, description: "5-bit field, usually D"}
      1-0:
        name: q
        description: instruction space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-r3:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode (per family)}
      27-25: {name: sel3, description: selector}
      24-21: {name: funct4, description: "operation select {G, op3}"}
      20-17: {name: reserved4, description: reserved (must be zero)}
      16-12: {name: field5, description: "second source B (or vector S)"}
      11-7: {name: field5, description: "first source A"}
      6-2: {name: field5, description: "destination D"}
      1-0:
        name: q
        description: instruction space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-r2:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode (per family)}
      27-25: {name: sel3, description: "selector, or 000"}
      24-22: {name: funct3, description: operation select}
      21-12: {name: reserved10, description: reserved (must be zero)}
      11-7: {name: S5, description: source register}
      6-2: {name: D5, description: destination register}
      1-0:
        name: q
        description: instruction space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-mr:
    bits: 32
    ranges:
      31-28: {name: major4, description: "major opcode (M_ROW)"}
      27-25: {name: sel3, description: "{TA, LS, IS}"}
      24-21: {name: tmJ4, description: TM descriptor index}
      20-17: {name: R4, description: Tile/Acc register}
      16-12: {name: index5, description: "row immediate or Scalar index (by IS)"}
      11-7: {name: xCoord5, description: "Scalar coordinate (xRowCol/xIndex)"}
      6-2: {name: xBase5, description: Scalar base address register}
      1-0:
        name: q
        description: instruction space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-rb:
    bits: 32
    ranges:
      31-28: {name: major4, description: "major opcode (E_BROW)"}
      27-25: {name: sel3, description: "{TA, 0, IS}"}
      24-21: {name: funct4, description: "operation select {G, op3}"}
      20-19: {name: reserved2, description: reserved (must be zero)}
      18-14: {name: index5, description: "row immediate or Scalar index (by IS)"}
      13-10: {name: B4, description: second matrix source (broadcast row)}
      9-6: {name: A4, description: first matrix source}
      5-2: {name: D4, description: matrix destination}
      1-0:
        name: q
        description: instruction space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-i:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode (per family)}
      27-26: {name: sel2, description: "2-bit selector (rf2 / config type)"}
      25-23: {name: funct3, description: operation or field select}
      22-7: {name: imm16, description: "16-bit immediate / payload16"}
      6-2: {name: D5/C5, description: data or config destination register}
      1-0:
        name: q
        description: instruction space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-z:
    bits: 32
    ranges:
      31-28: {name: major4, description: "major opcode (SYS)"}
      27-25:
        name: funct3
        description: operation select
        values: {"000": "fence.mem", "001": "fence.sa", "010": "fence.all", "011": "kernel.end", "1xx": "reserved"}
      24-2: {name: reserved23, description: reserved (must be zero)}
      1-0:
        name: q
        description: instruction space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
