structures:
  tc:
    bits: 32
    ranges:
      31-23: {name: reserved, description: reserved}
      22-20: {name: lo, description: layout, values: {"0": "canonical", "1-7": "reserved"}}
      19-16: {name: dt, description: dtype (element type), values: {"0": "i8", "1": "u8", "2": "i32", "3": "u32", "4": "f32", "5-15": "reserved"}}
      15-8: {name: cols, description: cols (valid columns)}
      7-0: {name: rows, description: rows (valid rows)}
  bc:
    bits: 32
    ranges:
      31-12: {name: reserved, description: reserved}
      11-8: {name: dt, description: dtype (element type), values: {"0": "i8", "1": "u8", "2": "i32", "3": "u32", "4": "f32", "5-15": "reserved"}}
      7-0: {name: len, description: len (valid length)}
  tm-0:
    bits: 128
    ranges:
      127-64: {name: col_stride_bytes, description: col_stride_bytes (signed, bytes)}
      63-16: {name: reserved, description: reserved}
      15-8: {name: fl, description: "flags"}
      7-4: {name: tf, description: transform, values: {"0": "normal", "1": "transpose", "2-15": "reserved"}}
      3-0: {name: sd, description: storage_dtype, values: {"0": "i8", "1": "u8", "2": "i32", "3": "u32", "4": "f32", "5": "f16", "6": "bf16", "7-15": "reserved"}}
  tm-1:
    bits: 128
