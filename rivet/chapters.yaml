structures:
  e-bin:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0000": "E_BIN"}}
      27-26: {name: dom2, description: data domain, values: {"00": "Tile", "01": "Acc", "11": "Vec32", "10": "reserved"}}
      25: {name: BX}
      24-21: {name: funct4, description: "{G, op3}"}
      20-17: {name: reserved4, description: must be 0}
      16-12:
        name: B5
        depends-on: 25
        values:
          0:
            description: B register
            structure: reg-b
          1:
            description: Scalar xS
            structure: reg-x
      11-7: {name: A5, description: src1 A}
      6-2: {name: D5, description: dst D}
      1-0: {name: q, description: "space tag (00)"}
  e-bcast:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0101": "E_BCAST"}}
      27: {name: TA, description: width pair, values: {"0": "Tile + Vec8", "1": "Acc + Vec32"}}
      26: {name: "0", description: must be 0}
      25: {name: DIR, description: broadcast dir, values: {"0": "byrow", "1": "bycol"}}
      24-21: {name: funct4, description: "{G, op3}"}
      20-17: {name: reserved4, description: must be 0}
      16-12: {name: S5, description: "vector src (Vec8/Vec32)"}
      11-7: {name: A5, description: matrix src1 A}
      6-2: {name: D5, description: matrix dst D}
      1-0: {name: q, description: "space tag (00)"}
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0001": "E_UNARY"}}
      27-26: {name: dom2, description: data domain, values: {"00": "Tile", "01": "Acc", "11": "Vec32", "10": "reserved"}}
      25: {name: "0", description: must be 0}
      24-22: {name: funct3, description: op, values: {"000": "not", "001": "abs", "010": "neg", "011": "exp2.approx", "100": "rcp.approx", "101": "rsqrt.approx"}}
      21-12: {name: reserved10, description: must be 0}
      11-7: {name: S5, description: src reg}
      6-2: {name: D5, description: dst reg}
      1-0: {name: q, description: "space tag (00)"}
  e-unary:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0001": "E_UNARY"}}
      27-26: {name: dom2, description: data domain, values: {"00": "Tile", "01": "Acc", "11": "Vec32", "10": "reserved"}}
      25: {name: "0", description: must be 0}
      24-22: {name: funct3, description: op, values: {"000": "not", "001": "abs", "010": "neg", "011": "exp2.approx", "100": "rcp.approx", "101": "rsqrt.approx"}}
      21-12: {name: reserved10, description: must be 0}
      11-7: {name: S5, description: src reg}
      6-2: {name: D5, description: dst reg}
      1-0: {name: q, description: "space tag (00)"}
  e-cmp:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0010": "E_CMP"}}
      27-26: {name: dom2, description: data domain, values: {"01": "Acc", "11": "Vec32", "00": "reserved", "10": "reserved"}}
      25: {name: BX}
      24-22: {name: funct3, description: cond, values: {"000": "eq (int/f32)", "001": "ne (int)", "010": "lt (int/f32)", "011": "ge (int)", "100": "le (f32)", "101": "unord (f32)"}}
      21-17: {name: reserved5, description: must be 0}
      16-12:
        name: B5
        depends-on: 25
        values:
          0:
            description: B register
            structure: reg-b
          1:
            description: Scalar xS
            structure: reg-x
      11-7: {name: A5, description: src1 A}
      6-2: {name: M5, description: "mask dst (u32)"}
      1-0: {name: q, description: "space tag (00)"}
  e-r4:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0011": "E_R4"}}
      27-26: {name: dom2, description: data domain, values: {"00": "Tile", "01": "Acc", "11": "Vec32", "10": "reserved"}}
      25: {name: "0", description: must be 0}
      24-22: {name: funct3, values: {"000": "select", "001": "fmadd"}}
      21-17: {name: arg5, description: "4th operand: mask M (select) / addend C (fmadd)"}
      16-12: {name: B5, description: src2 B}
      11-7: {name: A5, description: src1 A}
      6-2: {name: D5, description: dst D}
      1-0: {name: q, description: "space tag (00)"}
  e-mask:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0100": "E_MASK"}}
      27-26: {name: dom2, description: data domain, values: {"00": "Tile", "01": "Acc", "10": "Vec8", "11": "Vec32"}}
      25: {name: FS}
      24-22: {name: funct3, values: {"000": "tail", "001": "tril", "010": "triu"}}
      21-17:
        name: arg5
        depends-on: 25
        values:
          0:
            description: fill imm
            structure: fill-imm
          1:
            description: Scalar xFill
            structure: fill-x
      16-12: {name: xBound5, description: "Scalar bound (xBounds/xLen/xDelta)"}
      11-7: {name: S5, description: src reg}
      6-2: {name: D5, description: dst reg}
      1-0: {name: q, description: "space tag (00)"}
  m-blk:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0000": "M_BLK"}}
      27-26: {name: dom2, description: data domain, values: {"00": "Tile", "01": "Acc", "10": "Vec8", "11": "Vec32"}}
      25: {name: LS, values: {"0": "load", "1": "store"}}
      24-22: {name: funct3, description: op, values: {"000": "block load/store", "001": "gather (Tile load)", "010": "row (MR layout)", "011-111": "reserved"}}
      21-12: {name: reserved10, description: must be 0}
      11-7: {name: S5, description: "gather index vS; else 0"}
      6-2: {name: D5, description: "D (load) / S (store); bound descriptor implied"}
      1-0: {name: q, description: "space tag (01)"}
  m-row:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0000": "M_BLK"}}
      27: {name: TA, description: matrix domain, values: {"0": "Tile", "1": "Acc"}}
      26: {name: LS, values: {"0": "load.row", "1": "store.row"}}
      25: {name: IS}
      24-22: {name: funct3, description: op, values: {"010": "row load/store"}}
      21-17: {name: reserved5, description: must be 0}
      16-12:
        name: index5
        depends-on: 25
        values:
          0:
            description: immediate index
            structure: index-imm
          1:
            description: Scalar index register
            structure: index-x
      11-7: {name: reserved5, description: must be 0}
      6-2: {name: reg5, description: "Tile/Acc reg (bound TM/AM implied)"}
      1-0: {name: q, description: "space tag (01)"}
  init-fill:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0010": "INIT_MOVE"}}
      27-26: {name: dom2, description: data domain, values: {"00": "Tile", "01": "Acc", "10": "Vec8", "11": "Vec32"}}
      25-23: {name: funct3, description: "000 = fill"}
      22-7: {name: payload16, description: "imm payload (per dtype)"}
      6-2: {name: D5, description: dst reg}
      1-0: {name: q, description: "space tag (01)"}
  init-move:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0010": "INIT_MOVE"}}
      27-26: {name: dom2, description: data domain, values: {"00": "Tile", "01": "Acc", "10": "Vec8", "11": "Vec32"}}
      25: {name: "0", description: must be 0}
      24-22: {name: funct3, description: op, values: {"001": "fillx", "010": "copy", "011": "ttranspose"}}
      21-12: {name: reserved10, description: must be 0}
      11-7: {name: S5, description: "src reg / Scalar xS (fillx)"}
      6-2: {name: D5, description: dst reg}
      1-0: {name: q, description: "space tag (01)"}
  row-move:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0011": "ROW_MOVE"}}
      27: {name: EW, description: element width, values: {"0": "8-bit (Tile/Vec8)", "1": "32-bit (Acc/Vec32)"}}
      26: {name: "0", description: must be 0}
      25: {name: IS}
      24-22: {name: funct3, description: op, values: {"000": "insert.row", "001": "extract.row"}}
      21-17: {name: reserved5, description: must be 0}
      16-12:
        name: index5
        depends-on: 25
        values:
          0:
            description: immediate index
            structure: index-imm
          1:
            description: Scalar index register
            structure: index-x
      11-7: {name: S5, description: src reg}
      6-2: {name: D5, description: dst reg}
      1-0: {name: q, description: "space tag (01)"}
  lane-move:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0100": "LANE_MOVE"}}
      27: {name: EW, description: element width, values: {"0": "8-bit (Vec8)", "1": "32-bit (Vec32)"}}
      26: {name: "0", description: must be 0}
      25: {name: IS}
      24-22: {name: funct3, description: op, values: {"000": "extract", "001": "insert", "010": "broadcast"}}
      21-17: {name: reserved5, description: must be 0}
      16-12:
        name: index5
        depends-on: 25
        values:
          0:
            description: immediate index
            structure: index-imm
          1:
            description: Scalar index register
            structure: index-x
      11-7: {name: S5, description: src reg}
      6-2: {name: D5, description: dst reg}
      1-0: {name: q, description: "space tag (01)"}
  mma-bdot:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0000": "MMA_BDOT"}}
      27-25: {name: reserved3, description: must be 0}
      24-22: {name: funct3, description: op, values: {"000": "mma.nn.zero", "001": "mma.nn.acc", "010": "mma.nt.zero", "011": "mma.nt.acc", "100": "bdot.nn", "110": "bdot.nt"}}
      21-17: {name: reserved5, description: must be 0}
      16-12: {name: B5, description: "src2 (Tile)"}
      11-7: {name: A5, description: "src1 (Tile/Vec8)"}
      6-2: {name: D5, description: "dst (Acc/Vec32)"}
      1-0: {name: q, description: "space tag (10)"}
  red:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0001": "AREDUCE", "0010": "VREDUCE"}}
      27-25: {name: reserved3, description: must be 0}
      24-22: {name: funct3, description: reduce op, values: {"000": "sum", "001": "max", "010": "min", "011": "sumsq", "100": "argmax (VREDUCE, R4 form)"}}
      21-12: {name: reserved10, description: must be 0}
      11-7: {name: S5, description: "src (Acc/Vec32)"}
      6-2: {name: D5, description: "dst (Vec32/Scalar)"}
      1-0: {name: q, description: "space tag (10)"}
  vreduce-argmax:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0010": "VREDUCE"}}
      27-25: {name: reserved3, description: must be 0}
      24-22: {name: funct3, description: "100 = argmax"}
      21-17: {name: reserved5, description: must be 0}
      16-12: {name: S5, description: "src vS (Vec32)"}
      11-7: {name: xVal5, description: "dst xValue (f32 bits)"}
      6-2: {name: D5, description: "dst xIndex (i32)"}
      1-0: {name: q, description: "space tag (10)"}
  cvt:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0011": "CVT"}}
      27-26: {name: dom2, description: dst domain, values: {"01": "Acc", "11": "Vec32", "00": "reserved", "10": "reserved"}}
      25: {name: "0", description: must be 0}
      24-22: {name: funct3, values: {"000": "i32 -> f32 (acvt/vcvt)", "001": "i8 -> i32 widen (twiden)"}}
      21-12: {name: reserved10, description: must be 0}
      11-7: {name: S5, description: src reg}
      6-2: {name: D5, description: dst reg}
      1-0: {name: q, description: "space tag (10)"}
  qnt:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0100": "QNT"}}
      27-26: {name: dom2, description: dst domain, values: {"00": "Tile", "01": "Acc", "10": "Vec8", "11": "Vec32"}}
      25: {name: IS}
      24-22: {name: funct3, description: op, values: {"000": "quant/dequant", "001": "quant w/ ext scale (Tile dst)", "010-111": "reserved"}}
      21-17: {name: vScale5, description: "scale reg (dst/src by op)"}
      16-12:
        name: index5
        depends-on: 25
        values:
          0:
            description: immediate index
            structure: index-imm
          1:
            description: Scalar index register
            structure: index-x
      11-7: {name: S5, description: main src}
      6-2: {name: D5, description: main dst}
      1-0: {name: q, description: "space tag (10)"}
  cfg-seti:
