    ranges:
      31-28: {name: major4, description: major opcode, values: {"0101": "CFG_MAT_SETI", "0110": "CFG_VEC_SETI"}}
      27-26: {name: sel2, description: config type, values: {"00": "TC / BC", "01": "AC / VC", "10": "TM / BM", "11": "AM / VM"}}
      25-23: {name: field3, description: "field number, see field table"}
      22-7: {name: imm16, description: field value}
      6-2: {name: C5, description: dst config reg}
      1-0: {name: q, description: "space tag (10)"}
  cfg-reg:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"0111": "CFG_REG"}}
      27-26: {name: sel2, description: config type, values: {"00": "TC / BC", "01": "AC / VC", "10": "TM / BM", "11": "AM / VM"}}
      25: {name: MV, description: config side, values: {"0": "matrix config", "1": "vector config"}}
      24-22: {name: funct3, description: op, values: {"000": "cfg.setx C, field, xS", "001": "cfg.copy CD, CS", "010": "cfg.get xD, C, field"}}
      21-17: {name: field5, description: "field no. (low 3 bits; high 2 = 00)"}
      16-12: {name: reserved5, description: must be 0}
      11-7: {name: S5, description: "src xS / config CS"}
      6-2: {name: D5, description: "dst config / Scalar xD"}
      1-0: {name: q, description: "space tag (10)"}
  sys:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode, values: {"1000": "SYS"}}
      27-25: {name: funct3, description: op, values: {"000": "fence.mem", "001": "fence.sa", "010": "fence.all", "011": "kernel.end"}}
      24-2: {name: reserved23, description: must be 0}
      1-0: {name: q, description: "space tag (10)"}
  index-imm:
    bits: 5
    ranges:
      4-0: {name: imm5}
  index-x:
    bits: 5
    ranges:
      4-0: {name: xIdx5}
  reg-b:
    bits: 5
    ranges:
      4-0: {name: B5}
  reg-x:
    bits: 5
    ranges:
