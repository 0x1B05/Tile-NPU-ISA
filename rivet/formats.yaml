# Instruction format plates (32-bit non-scalar instruction word).
# Field colors follow roles: major4 purple, selector light purple, funct
# blue-grey, operand fields yellow/orange/green/teal, reserved grey, q pink.
colors:
  fmt-r4:
    "31-28": "179,163,205"
    "27-25": "196,186,209"
    "24-22": "192,200,210"
    "21-17": "240,214,148"
    "16-12": "238,183,150"
    "11-7": "163,200,177"
    "6-2": "167,199,200"
    "1-0": "222,184,203"
  fmt-r3:
    "31-28": "179,163,205"
    "27-25": "196,186,209"
    "24-21": "192,200,210"
    "20-17": "230,230,230"
    "16-12": "238,183,150"
    "11-7": "163,200,177"
    "6-2": "167,199,200"
    "1-0": "222,184,203"
  fmt-r2:
    "31-28": "179,163,205"
    "27-25": "196,186,209"
    "24-22": "192,200,210"
    "21-12": "230,230,230"
    "11-7": "163,200,177"
    "6-2": "167,199,200"
    "1-0": "222,184,203"
  fmt-mr:
    "31-28": "179,163,205"
    "27": "196,186,209"
    "26": "196,186,209"
    "25": "196,186,209"
    "24-22": "192,200,210"
    "21-17": "230,230,230"
    "16-12": "163,200,177"
    "11-7": "230,230,230"
    "6-2": "238,183,150"
    "1-0": "222,184,203"
  fmt-i:
    "31-28": "179,163,205"
    "27-26": "196,186,209"
    "25-23": "192,200,210"
    "22-7": "240,214,148"
    "6-2": "167,199,200"
    "1-0": "222,184,203"
  fmt-z:
    "31-28": "179,163,205"
    "27-25": "192,200,210"
    "24-2": "230,230,230"
    "1-0": "222,184,203"

structures:
  fmt-r4:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode}
      27-25: {name: sel3, description: "selector or 000"}
      24-22: {name: funct3, description: op select}
      21-17: {name: field5, description: per major4}
      16-12: {name: field5, description: "usually B/xBound"}
      11-7: {name: field5, description: "usually A/S"}
      6-2: {name: field5, description: "usually D"}
      1-0:
        name: q
        description: space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-r3:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode}
      27-25: {name: sel3, description: selector}
      24-21: {name: funct4, description: "{G, op3}"}
      20-17: {name: reserved4, description: must be 0}
      16-12: {name: field5, description: "src2 B (or vector S)"}
      11-7: {name: field5, description: src1 A}
      6-2: {name: field5, description: dst D}
      1-0:
        name: q
        description: space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-r2:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode}
      27-25: {name: sel3, description: "selector or 000"}
      24-22: {name: funct3, description: op select}
      21-12: {name: reserved10, description: must be 0}
      11-7: {name: S5, description: src reg}
      6-2: {name: D5, description: dst reg}
      1-0:
        name: q
        description: space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-mr:
    bits: 32
    ranges:
      31-28: {name: major4, description: "major opcode (M_BLK)"}
      27: {name: TA, description: matrix domain, values: {"0": "Tile", "1": "Acc"}}
      26: {name: LS, description: load/store sel, values: {"0": "load", "1": "store"}}
      25: {name: IS, description: row index src, values: {"0": "imm row", "1": "Scalar row"}}
      24-22: {name: funct3, description: "op (010 = row)"}
      21-17: {name: reserved5, description: must be 0}
      16-12: {name: index5, description: "row imm / Scalar idx (by IS)"}
      11-7: {name: reserved5, description: must be 0}
      6-2: {name: reg5, description: "Tile/Acc reg (bound TM/AM implied)"}
      1-0:
        name: q
        description: space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-i:
    bits: 32
    ranges:
      31-28: {name: major4, description: major opcode}
      27-26: {name: sel2, description: "dom2 / config type"}
      25-23: {name: funct3, description: "op / field select"}
      22-7: {name: imm16, description: "fill imm / field value"}
      6-2: {name: D5/C5, description: "data/config dst reg"}
      1-0:
        name: q
        description: space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
  fmt-z:
    bits: 32
    ranges:
      31-28: {name: major4, description: "major opcode (SYS)"}
      27-25:
        name: funct3
        description: op select
        values: {"000": "fence.mem", "001": "fence.sa", "010": "fence.all", "011": "kernel.end", "1xx": "reserved"}
      24-2: {name: reserved23, description: must be 0}
      1-0:
        name: q
        description: space tag
        values: {"00": "elementwise", "01": "data movement", "10": "cross-domain/control", "11": "scalar (RV64IM)"}
