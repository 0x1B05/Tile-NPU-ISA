# Config registers and memory descriptors: TC/AC (32-bit), VC (32-bit),
# TM/AM (128-bit, split into tm-0..tm-3), VM (96-bit, vm-0..vm-2).
colors:
  tc:
    "7-0": "240,214,148"
    "15-8": "238,183,150"
    "19-16": "163,200,177"
    "22-20": "192,200,210"
    "24-23": "196,186,209"
    "31-25": "230,230,230"
  ac:
    "7-0": "240,214,148"
    "15-8": "238,183,150"
    "19-16": "163,200,177"
    "22-20": "192,200,210"
    "31-23": "230,230,230"
  vc:
    "7-0": "240,214,148"
    "11-8": "163,200,177"
    "31-12": "230,230,230"
  vm-0:
    "31-0": "240,214,148"
  vm-1:
    "47-32": "240,214,148"
    "55-48": "163,200,177"
    "63-56": "230,230,230"
  vm-2:
    "95-64": "238,183,150"
  tm-0:
    "31-0": "240,214,148"
  tm-1:
    "47-32": "240,214,148"
    "51-48": "192,200,210"
    "59-52": "163,200,177"
    "63-60": "230,230,230"
  tm-2:
    "95-64": "238,183,150"
  tm-3:
    "127-96": "222,184,203"

structures:
  tc:
    bits: 32
    ranges:
      31-25: {name: reserved, description: must be 0}
      24-23: {name: am, description: arith mode, values: {"0": "wrap", "1": "sat", "10": "reserved", "11": "reserved"}}
      22-20: {name: lo, description: layout, values: {"0": "row_major", "1-7": "reserved"}}
      19-16: {name: dt, description: "element type (others reserved)", values: {"0000": "i8", "0001": "u8"}}
      15-8: {name: cols, description: valid cols}
      7-0: {name: rows, description: valid rows}
  ac:
    bits: 32
    ranges:
      31-23: {name: reserved, description: must be 0}
      22-20: {name: lo, description: layout, values: {"0": "row_major", "1-7": "reserved"}}
      19-16: {name: dt, description: "element type (others reserved)", values: {"0010": "i32", "0011": "u32", "0100": "f32"}}
      15-8: {name: cols, description: valid cols}
      7-0: {name: rows, description: valid rows}
  vc:
    bits: 32
    ranges:
      31-12: {name: reserved}
      11-8: {name: dt, description: "element type (others reserved)", values: {"0010": "i32", "0011": "u32", "0100": "f32"}}
      7-0: {name: len, description: valid len}
  tm-0:
    bits: 32
    ranges:
      31-0: {name: base_lo, description: "base_addr [31:0]"}
  tm-1:
    bits: 32
    start: 32
    ranges:
      63-60: {name: reserved}
      59-52: {name: flags, description: "[1:0] = inc_mode: post-access base_addr increment", values: {"0": "inc: none", "1": "inc: rows (rows x row_stride)", "2": "inc: cols (cols x col_stride)", "3-255": "reserved"}}
      51-48: {name: tf, description: transform, values: {"0": "normal", "1": "transpose", "2-15": "reserved"}}
      47-32: {name: base_hi, description: "base_addr [47:32]"}
  tm-2:
    bits: 32
    start: 64
    ranges:
      95-64: {name: row_stride_bytes, description: "signed, in bytes"}
  tm-3:
    bits: 32
    start: 96
    ranges:
      127-96: {name: col_stride_bytes, description: "signed, in bytes"}
  vm-0:
    bits: 32
    ranges:
      31-0: {name: base_lo, description: "base_addr [31:0]"}
  vm-1:
    bits: 32
    start: 32
    ranges:
      63-56: {name: reserved}
      55-48: {name: flags, description: "[0] = inc: post-access base_addr increment (len x stride)", values: {"0": "inc: none", "1": "inc: on", "2-255": "reserved"}}
      47-32: {name: base_hi, description: "base_addr [47:32]"}
  vm-2:
    bits: 32
    start: 64
    ranges:
      95-64: {name: stride_bytes, description: "signed, in bytes"}
