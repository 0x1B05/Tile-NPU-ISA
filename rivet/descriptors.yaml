# Config registers and memory descriptors: TC/AC (32-bit), BC/VC (32-bit),
# TM/AM (192-bit, split into tm-0/tm-1/tm-2), BM/VM (128-bit).
colors:
  tc:
    "7-0": "240,214,148"
    "15-8": "238,183,150"
    "19-16": "163,200,177"
    "22-20": "192,200,210"
    "24-23": "196,186,209"
    "31-25": "230,230,230"
  bc:
    "7-0": "240,214,148"
    "11-8": "163,200,177"
    "31-12": "230,230,230"
  vm:
    "63-0": "240,214,148"
    "95-64": "238,183,150"
    "103-96": "163,200,177"
    "127-104": "230,230,230"
  tm-0:
    "63-0": "240,214,148"
  tm-1:
    "95-64": "238,183,150"
    "127-96": "222,184,203"
  tm-2:
    "131-128": "192,200,210"
    "139-132": "163,200,177"
    "191-140": "230,230,230"

structures:
  tc:
    bits: 32
    ranges:
      31-25: {name: reserved}
      24-23: {name: am, description: "arith mode (TC only; reserved in AC)", values: {"0": "wrap", "1": "sat", "10": "reserved", "11": "reserved"}}
      22-20: {name: lo, description: layout, values: {"0": "row_major", "1-7": "reserved"}}
      19-16: {name: dt, description: "element type (TC: i8/u8; AC: i32/u32/f32)", values: {"0000": "i8", "0001": "u8", "0010": "i32", "0011": "u32", "0100": "f32", "5-15": "reserved"}}
      15-8: {name: cols, description: valid cols}
      7-0: {name: rows, description: valid rows}
  bc:
    bits: 32
    ranges:
      31-12: {name: reserved}
      11-8: {name: dt, description: "element type (BC: i8/u8; VC: i32/u32/f32)", values: {"0000": "i8", "0001": "u8", "0010": "i32", "0011": "u32", "0100": "f32", "5-15": "reserved"}}
      7-0: {name: len, description: valid len}
  tm-0:
    bits: 64
    ranges:
      63-0: {name: base_addr, description: "byte address of view origin"}
  tm-1:
    bits: 64
    start: 64
    ranges:
      95-64: {name: row_stride_bytes, description: "signed, in bytes"}
      127-96: {name: col_stride_bytes, description: "signed, in bytes"}
  tm-2:
    bits: 64
    start: 128
    ranges:
      191-140: {name: reserved}
      139-132: {name: flags, description: "[1:0] = inc_mode: post-access base_addr increment", values: {"0": "inc: none", "1": "inc: rows (rows x row_stride)", "2": "inc: cols (cols x col_stride)", "3-255": "reserved"}}
      131-128: {name: tf, description: transform, values: {"0": "normal", "1": "transpose", "2-15": "reserved"}}
  vm:
    bits: 128
    ranges:
      127-104: {name: reserved}
      103-96: {name: flags, description: "[0] = inc: post-access base_addr increment (len x stride)", values: {"0": "inc: none", "1": "inc: on", "2-255": "reserved"}}
      95-64: {name: stride_bytes, description: "signed, in bytes"}
      63-0: {name: base_addr, description: "byte address of view origin"}
